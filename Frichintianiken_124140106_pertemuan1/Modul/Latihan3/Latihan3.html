<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 3</title>
</head>

<body>

    <h1>Data Mahasiswa</h1>

    <button id="tampilkan">
        Tampilkan Data
    </button>

    <button id="namaAsc">
        Nama A-Z
    </button>

    <button id="namaDesc">
        Nama Z-A
    </button>

    <h2>Data Mahasiswa</h2>

    <table border="1" id="tabelMahasiswa">
        <thead>
            <tr>
                <th>Nama</th>
                <th>NIM</th>
                <th>Jurusan</th>
                <th>Nilai</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody id="dataMahasiswa"></tbody>
    </table>

    <h2>Mahasiswa Nilai Tertinggi</h2>
    <p id="nilaiTertinggi"></p>

    <h2>Mahasiswa Di Atas Rata-rata</h2>
    <ul id="diAtasRata"></ul>


    <h2>Tambah Mahasiswa</h2>

    <input type="text" id="nama" placeholder="Nama">
    <input type="text" id="nim" placeholder="NIM">
    <input type="text" id="jurusan" placeholder="Jurusan">
    <input type="number" id="nilai" placeholder="Nilai">

    <button id="tambah">
        Tambah
    </button>


    <script src="Latihan3.js"></script>

</body>
</html>
