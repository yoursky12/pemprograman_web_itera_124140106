[app:main]
use = egg:pyramid_mahasiswa
pyramid.reload_templates = false
tm.manager_hook = pyramid_tm.explicit_manager
tm.commit_veto = pyramid_tm.default_commit_veto
sqlalchemy.url = postgresql://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = 127.0.0.1:6543

[alembic]
script_location = %(here)s/pyramid_mahasiswa/alembic
